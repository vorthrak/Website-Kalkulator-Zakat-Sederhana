<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kalkulator Zakat</title>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
</head>
<body>
    <div class="container">
        <div class="tab-container">
            <div class="tab active" onclick="switchTab('zakat-maal')">Zakat Harta (Maal)</div>
            <div class="tab" onclick="switchTab('zakat-profesi')">Zakat Penghasilan</div>
        </div>

        <!-- Zakat Maal -->
        <form id="zakat-maal" class="tab-content active">
            <div class="form-group">
                <label for="hargaemas-maal">Masukkan Harga Emas saat ini:</label>
                <input type="number" id="hargaemas-maal" placeholder="Masukkan Harga Emas saat ini" required oninput="updateNisab('maal')">
            </div>
            <div class="form-group">
                <label for="nisab-tahun-maal">Nisab Satu Tahun:</label>
                <input type="text" id="nisab-tahun-maal" readonly>
                <small>Catatan: Nisab 1 tahun = harga 1 gram emas x 85 gram</small>
            </div>
            <div class="form-group">
                <label for="nisab-bulan-maal">Nisab Satu Bulan:</label>
                <input type="text" id="nisab-bulan-maal" readonly>
                <small>Catatan: Nisab 1 bulan = nisab 1 tahun / 12</small>
            </div>
            <div class="form-group"><label for="a">a. Uang Tunai, Tabungan, Deposito atau sejenisnya</label><input type="number" id="a" required oninput="updateHartaSimpananMaal()"></div>
            <div class="form-group"><label for="b">b. Saham atau surat-surat berharga lainnya</label><input type="number" id="b" required oninput="updateHartaSimpananMaal()"></div>
            <div class="form-group"><label for="c">c. Real Estate (tidak termasuk rumah tinggal)</label><input type="number" id="c" required oninput="updateHartaSimpananMaal()"></div>
            <div class="form-group"><label for="d">d. Emas, Perak, Permata atau sejenisnya</label><input type="number" id="d" required oninput="updateHartaSimpananMaal()"></div>
            <div class="form-group"><label for="e">e. Mobil (lebih dari keperluan pokok)</label><input type="number" id="e" required oninput="updateHartaSimpananMaal()"></div>
            <div class="form-group"><label for="f">f. Jumlah Harta Simpanan</label><input type="text" id="f" readonly></div>
            <div class="form-group"><label for="g">g. Hutang Pribadi jatuh tempo tahun ini</label><input type="number" id="g" required oninput="updateHartaSimpananMaal()"></div>
            <div class="form-group"><label for="h">h. Harta Simpanan Kena Zakat (F-G)</label><input type="text" id="h" readonly></div>
            <button type="button" onclick="hitungZakat('maal')">Hitung Zakat</button>
        </form>

        <!-- Zakat Profesi -->
        <form id="zakat-profesi" class="tab-content">
            <div class="form-group">
                <label for="penghasilan-profesi">Penghasilan Bulanan:</label>
                <input type="number" id="penghasilan-profesi" required oninput="updatePenghasilanBersihProfesi()">
            </div>
            <div class="form-group">
                <label for="kebutuhan-profesi">Kebutuhan Pokok Bulanan:</label>
                <input type="number" id="kebutuhan-profesi" required oninput="updatePenghasilanBersihProfesi()">
            </div>
            <div class="form-group">
                <label for="penghasilan-bersih-profesi">Penghasilan Bersih:</label>
                <input type="text" id="penghasilan-bersih-profesi" readonly>
            </div>
            <div class="form-group">
                <label for="hargaemas-profesi">Harga Emas Saat Ini:</label>
                <input type="number" id="hargaemas-profesi" required oninput="updateNisab('profesi')">
            </div>
            <div class="form-group">
                <label for="nisab-tahun-profesi">Nisab Satu Tahun:</label>
                <input type="text" id="nisab-tahun-profesi" readonly>
                <small>Catatan: Nisab 1 tahun = harga 1 gram emas x 85 gram</small>
            </div>
            <div class="form-group">
                <label for="nisab-bulan-profesi">Nisab Satu Bulan:</label>
                <input type="text" id="nisab-bulan-profesi" readonly>
                <small>Catatan: Nisab 1 bulan = nisab 1 tahun / 12</small>
            </div>
            <button type="button" onclick="hitungZakat('profesi')">Hitung Zakat</button>
        </form>

        <div id="result"></div>

        <!-- Tombol berdasarkan hasil -->
        <div id="buttons-below-nisab" style="display: none;">
            <button class="reset-button" onclick="resetForm()">Reset</button>
            <a href="https://lazalbahjah.org/program/" class="action-button sedekah-button" target="_blank">Sedekah Sekarang</a>
        </div>
        <div id="buttons-above-nisab" style="display: none;">
            <button class="reset-button" onclick="resetForm()">Reset</button>
            <a href="https://lazalbahjah.org/preview/zakat-penghasilan-profesi/donasi-sekarang" class="action-button zakat-button" target="_blank">Zakat Sekarang</a>
        </div>
        <div id="buttons-below-nisab-maal" style="display: none;">
            <button class="reset-button" onclick="resetForm()">Reset</button>
            <a href="https://lazalbahjah.org/program/" class="action-button sedekah-button" target="_blank">Sedekah Sekarang</a>
        </div>
        <div id="buttons-above-nisab-maal" style="display: none;">
            <button class="reset-button" onclick="resetForm()">Reset</button>
            <a href="https://lazalbahjah.org/campaign/zakat-harta-maal" class="action-button zakat-button" target="_blank">Zakat Sekarang</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
